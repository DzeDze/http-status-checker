[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "http-status-checker"
version = "0.1.0"
description = "A simple CLI tool to check the HTTP status of given URLs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28, <3.0",
    "click>=8.0, <9.0"
]
